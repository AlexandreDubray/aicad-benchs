[package]
name = "aicad-benchs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Micro-benchmarks of the aicad constraint functions on shapes seen in the XCSP3 benchmarks and PSPLIB."

[dependencies]
aicad = { path = "../aicad", default-features = false }
rustc-hash = "2.1"
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "constraints"
harness = false

[profile.bench]
debug = 1

# One code-generation unit: the compiler inlines only within a unit, so with the default 16 an edit
# anywhere in aicad can move the instruction counts of an unrelated function by a few instructions.
# With one, a count changes only when the code it measures does. This applies to the benchmark
# build only (`bench` inherits from `release`), not to how aicad itself is built.
[profile.release]
codegen-units = 1
