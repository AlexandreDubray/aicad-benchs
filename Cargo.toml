[package]
name = "aicad-benchs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Micro-benchmarks of the aicad constraint functions on shapes seen in the XCSP3 benchmarks."

[dependencies]
aicad = { path = "../aicad", default-features = false }
rustc-hash = "2.1"
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "constraints"
harness = false

[profile.bench]
debug = 1
